# 拾光集论坛 · nginx 反向代理站点配置
# 安装位置：/etc/nginx/sites-available/forum（setup.sh 会把 __DOMAIN__ 替换为实际域名）
# 说明：certbot --nginx 会自动追加 443 监听与 HTTP→HTTPS 跳转，勿手动重复添加。

# 全局限流：同一 IP 每秒最多 5 次请求，突发放宽到 20
limit_req_zone $binary_remote_addr zone=forum:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 上传限制（帖子/广告图片走外链，体积极小；按需调整）
    client_max_body_size 2m;

    location / {
        limit_req zone=forum burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 60s;
    }
}